name: Build Custom Kernel with RTL8188EU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libncurses-dev git wget unzip

      - name: Download kernel source
        run: |
          wget -q -O Kernel.tar.gz "https://github.com/Faisal-The-1/a2core-rtl8188eus-build/releases/download/v1/Kernel.tar.gz"
          mkdir -p kernel_src
          tar xzf Kernel.tar.gz -C kernel_src

      - name: Download legacy NDK toolchain (GCC 4.9)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip "android-ndk-r16b/toolchains/aarch64-linux-android-4.9/*"
          echo "TOOLCHAIN_BIN=${{ github.workspace }}/android-ndk-r16b/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Configure kernel with device config
        working-directory: kernel_src
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc

          # Copy the running config from the device as our base
          cp ${{ github.workspace }}/kernel_config.txt .config

          # Disable module signing
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --set-str CONFIG_LOCALVERSION "-15641782-QB44726894"

          # Apply config
          yes "" | make HOSTCFLAGS="-fcommon" oldconfig

      - name: Build kernel Image and DTBs
        working-directory: kernel_src
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc

          # Build kernel Image + all device tree blobs
          yes "" | make HOSTCFLAGS="-fcommon" -j$(nproc) Image dtbs
          echo "Kernel release: $(cat include/config/kernel.release)"

          # List built DTBs so we can identify the correct one
          echo "=== Built DTBs ==="
          find arch/arm64/boot/dts -name "*.dtb" | head -20

      - name: Clone and patch RTL8188EU driver
        run: |
          git clone https://github.com/lwfinger/rtl8188eu driver
          cd driver
          # Remove GCC 7+ fallthrough attributes
          find . -name "*.c" -exec sed -i '/fallthrough/d' {} +

      - name: Build RTL8188EU module against our kernel
        working-directory: driver
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc

          # Inject warning suppressions into Makefile (NOT command line)
          sed -i '1i EXTRA_CFLAGS += -Wno-error -Wno-declaration-after-statement' Makefile

          # Build module against OUR kernel tree (CRCs will match perfectly)
          make KSRC=${{ github.workspace }}/kernel_src modules

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel_src/arch/arm64/boot/Image

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbs
          path: kernel_src/arch/arm64/boot/dts/**/*.dtb

      - name: Upload RTL8188EU module
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-module
          path: driver/8188eu.ko

      - name: Upload Module.symvers and config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debug
          path: |
            kernel_src/Module.symvers
            kernel_src/.config
            kernel_src/include/config/kernel.release
