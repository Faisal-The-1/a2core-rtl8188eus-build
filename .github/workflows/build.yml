name: Build Ready-to-Flash Boot Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libncurses-dev git wget unzip

      - name: Download kernel source
        run: |
          wget -q -O Kernel.tar.gz "https://github.com/Faisal-The-1/a2core-rtl8188eus-build/releases/download/v1/Kernel.tar.gz"
          mkdir -p kernel_src
          tar xzf Kernel.tar.gz -C kernel_src

      - name: Download boot assets
        run: |
          wget -q -O stock_boot.img "https://github.com/Faisal-The-1/a2core-rtl8188eus-build/releases/download/v2/stock_boot.img"
          wget -q -O magiskboot "https://github.com/Faisal-The-1/a2core-rtl8188eus-build/releases/download/v2/magiskboot"
          chmod +x magiskboot

      - name: Download legacy NDK toolchain (GCC 4.9)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip "android-ndk-r16b/toolchains/aarch64-linux-android-4.9/*"
          echo "TOOLCHAIN_BIN=${{ github.workspace }}/android-ndk-r16b/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Clone and patch RTL8188EU driver into kernel tree
        run: |
          git clone https://github.com/lwfinger/rtl8188eu kernel_src/drivers/net/wireless/rtl8188eu
          cd kernel_src/drivers/net/wireless/rtl8188eu
          find . -name "*.c" -exec sed -i '/fallthrough/d' {} +

      - name: Patch kernel Makefiles to include RTL8188EU
        run: |
          cd kernel_src/drivers/net/wireless
          echo 'obj-y += rtl8188eu/' >> Makefile

      - name: Configure kernel (SAFE — only modversions disabled)
        working-directory: kernel_src
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc
          cp ${{ github.workspace }}/kernel_config.txt .config
          scripts/config --disable CONFIG_MODVERSIONS
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --set-str CONFIG_LOCALVERSION "-15641782-QB44726894"
          yes "" | make HOSTCFLAGS="-fcommon" oldconfig

      - name: Build kernel Image
        working-directory: kernel_src
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc
          yes "" | make HOSTCFLAGS="-fcommon" -j$(nproc) Image
          ls -lh arch/arm64/boot/Image

      - name: Build RTL8188EU module (matching vermagic)
        run: |
          cd kernel_src/drivers/net/wireless/rtl8188eu
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc
          sed -i '1i EXTRA_CFLAGS += -Wno-error -Wno-declaration-after-statement' Makefile
          make KSRC=${{ github.workspace }}/kernel_src modules
          ls -lh 8188eu.ko

      - name: Repack boot image with DTB
        run: |
          ./magiskboot unpack stock_boot.img
          cp extra dtb_backup.img
          cp kernel_src/arch/arm64/boot/Image kernel
          cp dtb_backup.img extra
          ./magiskboot repack stock_boot.img
          mv new-boot.img custom-boot.img
          ls -lh custom-boot.img

      - name: Upload ready-to-flash boot image
        uses: actions/upload-artifact@v4
        with:
          name: custom-boot-img
          path: custom-boot.img

      - name: Upload RTL8188EU module
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-module
          path: kernel_src/drivers/net/wireless/rtl8188eu/8188eu.ko
