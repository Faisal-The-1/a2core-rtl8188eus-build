name: Build RTL8188EUS for A2 Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libncurses-dev git wget unzip

      - name: Download kernel source
        run: |
          wget -q -O Kernel.tar.gz "https://github.com/Faisal-The-1/a2core-rtl8188eus-build/releases/download/v1/Kernel.tar.gz"
          mkdir -p kernel_src
          tar xzf Kernel.tar.gz -C kernel_src

      - name: Download legacy NDK toolchain (GCC 4.9)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip "android-ndk-r16b/toolchains/aarch64-linux-android-4.9/*"
          echo "TOOLCHAIN_BIN=${{ github.workspace }}/android-ndk-r16b/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Configure kernel
        working-directory: kernel_src
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc
          
          yes "" | make HOSTCFLAGS="-fcommon" exynos7870-a2corelte_defconfig || yes "" | make HOSTCFLAGS="-fcommon" exynos7870_defconfig
          
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          
          scripts/config --set-str CONFIG_LOCALVERSION "-15641782-QB44726894"

      - name: Build kernel (generates fresh Module.symvers)
        working-directory: kernel_src
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc
          
          yes "" | make HOSTCFLAGS="-fcommon" -j$(nproc) Image
          echo "Kernel release: $(cat include/config/kernel.release)"

      - name: Clone driver
        run: git clone https://github.com/aircrack-ng/rtl8188eus driver

      - name: Build driver
        working-directory: driver
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=o
          export HOSTCC=gcc
          
          # 1. Set platform to Android ARM64
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_ANDROID = n/CONFIG_PLATFORM_ARM_ANDROID = y/' Makefile
          
          # 2. FIX: Strip all -Werror flags from the Makefile to prevent warnings from failing the build
          sed -i 's/-Werror//g' Makefile
          
          # 3. Build with explicit include paths and comprehensive warning suppressions
          DRIVER_DIR="${{ github.workspace }}/driver"
          make KSRC=${{ github.workspace }}/kernel_src EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -I${DRIVER_DIR}/include -I${DRIVER_DIR}/hal/phydm -Wno-error -Wno-implicit-fallthrough -Wno-unused-variable -Wno-unused-but-set-variable" modules

      - name: Upload Kernel Module
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-module
          path: driver/8188eu.ko

      - name: Upload Debug Files
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debug-files
          path: |
            kernel_src/.config
            kernel_src/Module.symvers
            kernel_src/include/config/kernel.release
